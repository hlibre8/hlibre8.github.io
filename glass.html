<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Glassblowing and creative work by Hossein Libre.">
  <title>Glass | Hossein Libre</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>document.documentElement.classList.add('has-js');</script>
  <script defer src="assets/js/site.js"></script>
  <script defer src="assets/js/gallery-generated.js"></script>
  <script defer src="assets/js/gallery.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header always-solid" aria-label="Main navigation">
    <div class="nav-shell">
      <a class="brand" href="index.html">Hossein Libre</a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation"><span></span><span></span><span></span></button>
      <nav class="primary-nav" id="primary-nav">
        <a href="index.html">About</a>
        <a href="research.html">Research</a>
        <a href="news.html">News</a>
        <a href="glass.html" aria-current="page">Glass</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="interior-main glass-page" id="main-content">
    <section class="page-masthead glass-masthead">
      <img class="page-masthead-photo glass-masthead-photo" src="assets/images/glass-hero.jpg" alt="Torch heating a rounded green and amber glass piece during glassblowing">
      <div class="page-masthead-content">
        <p class="eyebrow">Glass + Creative Work</p>
        <h1>Heat, movement, light, and transformation.</h1>
      </div>
    </section>

    <section class="page-body glass-gallery-section">
      <div class="content-shell glass-gallery-shell">
        <div class="gallery-topline">
          <h2>Gallery</h2>
          <div class="gallery-filters" aria-label="Gallery filters">
            <button class="gallery-filter is-active" type="button" data-gallery-filter="All" aria-pressed="true">All</button>
            <button class="gallery-filter" type="button" data-gallery-filter="Glass" aria-pressed="false">Glass</button>
            <button class="gallery-filter" type="button" data-gallery-filter="Photography" aria-pressed="false">Photography</button>
          </div>
        </div>
        <div class="masonry-gallery" data-gallery-grid aria-live="polite"></div>
        <p class="gallery-empty" data-gallery-empty hidden>Add images to <code>assets/images/gallery/</code>, update <code>assets/js/gallery-data.js</code>, then run <code>python3 scripts/analyze-gallery.py</code>.</p>
      </div>
    </section>
  </main>

  <div class="gallery-lightbox" data-gallery-lightbox aria-hidden="true" role="dialog" aria-modal="true" aria-label="Gallery image viewer">
    <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close gallery viewer">×</button>
    <button class="lightbox-nav lightbox-prev" type="button" data-lightbox-prev aria-label="Previous image">‹</button>
    <figure class="lightbox-figure">
      <img data-lightbox-image alt="">
      <figcaption>
        <h2 data-lightbox-title></h2>
        <p data-lightbox-meta></p>
        <p class="lightbox-location" data-lightbox-location hidden></p>
        <p data-lightbox-caption hidden></p>
      </figcaption>
    </figure>
    <button class="lightbox-nav lightbox-next" type="button" data-lightbox-next aria-label="Next image">›</button>
  </div>

  <footer class="site-footer"><div class="footer-shell"><span>© <span data-current-year></span> Hossein Libre</span></div></footer>
</body>
</html>
